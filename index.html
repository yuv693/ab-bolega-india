<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ab Bolega India - All-in-One IRCTC Voice Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes sound-wave-glow {
            0% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.4; transform: scale(0.98); }
        }
        .audio-wave-bg {
            animation: sound-wave-glow 1.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-2 font-sans">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md bg-orange-500 border-[6px] border-slate-800 rounded-[35px] shadow-2xl overflow-hidden flex flex-col justify-between p-3 relative min-h-[720px]">
        
        <!-- Top Header Bar -->
        <div class="bg-orange-600 px-3 py-2 rounded-2xl flex items-center justify-between text-white shadow-md">
            <div class="flex items-center space-x-2">
                <div class="w-7 h-7 bg-blue-900 rounded-full flex items-center justify-center border border-white">
                    <i class="fa-solid fa-train text-white text-[10px]"></i>
                </div>
                <div>
                    <span class="font-black text-sm tracking-wider block leading-tight text-yellow-300 drop-shadow">AB BOLEGA INDIA</span>
                    <span class="text-[8px] text-orange-200 block">All-in-One IRCTC Assistant</span>
                </div>
            </div>
            <div class="flex items-center space-x-2 text-xs text-orange-200">
                <i class="fa-solid fa-ellipsis-vertical"></i>
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>

        <!-- Mode Selector Tabs -->
        <div class="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-xl my-1 text-[10px] font-bold text-center">
            <button id="tab-pnr" onclick="switchMode('pnr')" class="py-1.5 rounded-lg bg-orange-600 text-white transition">PNR Status</button>
            <button id="tab-train" onclick="switchMode('train')" class="py-1.5 rounded-lg text-slate-400 hover:text-white transition">Train Search</button>
        </div>

        <!-- Voice Booking Box -->
        <div class="bg-slate-900 text-slate-100 rounded-2xl p-3 shadow-lg border border-orange-400/40 text-center my-1">
            <h1 id="mode-title" class="text-[11px] font-black text-orange-400 tracking-wider leading-snug drop-shadow mb-0.5">
                PNR STATUS VOICE CHECKER
            </h1>
            <p id="mode-subtitle" class="text-[9px] text-yellow-400 font-bold mb-1">🎤 10-digit PNR number bolein</p>
            
            <!-- Center Mic -->
            <div class="flex flex-col items-center justify-center my-2 relative">
                <div class="absolute inset-0 flex items-center justify-center space-x-1 audio-wave-bg pointer-events-none opacity-80">
                    <span class="w-1 h-4 bg-orange-500/40 rounded-full"></span>
                    <span class="w-1.5 h-8 bg-orange-400 rounded-full"></span>
                    <span class="w-2 h-14 bg-white rounded-full shadow-[0_0_10px_rgba(255,255,255,0.8)]"></span>
                    <span class="w-1.5 h-8 bg-orange-400 rounded-full"></span>
                    <span class="w-1 h-4 bg-orange-500/40 rounded-full"></span>
                </div>

                <button onclick="toggleVoiceRecording()" class="relative z-10 w-16 h-16 bg-slate-950 border-2 border-orange-400 rounded-full flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition">
                    <i class="fa-solid fa-microphone text-white text-xl" id="mic-icon"></i>
                </button>
                
                <span id="mic-label" class="relative z-10 text-[9px] font-bold tracking-widest text-orange-400 mt-1 uppercase">
                    TAP TO SPEAK
                </span>
            </div>

            <!-- Live Status & API Response -->
            <div class="bg-slate-950 text-left rounded-xl p-2 text-[10px] space-y-0.5 border border-slate-800 max-h-36 overflow-y-auto">
                <div class="text-orange-300 font-bold flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-red-600 rounded-full animate-pulse"></span> Result Box:
                </div>
                <div class="text-slate-300" id="output-status">• Status: Ready</div>
                <div class="text-slate-300" id="output-query">• Query: [Aapka Input]</div>
                <!-- Train Details Container -->
                <div id="train-list-container" class="mt-1 space-y-1 text-slate-200"></div>
            </div>

            <div id="transcript-box" class="text-[9px] text-slate-400 mt-1">
                Mic par click karke details bolein...
            </div>
        </div>

        <!-- Mini Service Icons -->
        <div class="bg-white text-slate-900 rounded-2xl p-2 shadow">
            <div class="grid grid-cols-3 gap-1.5 text-center">
                <div class="p-1 bg-slate-50 rounded-lg border">
                    <i class="fa-solid fa-plane text-blue-600 text-[10px]"></i>
                    <span class="block text-[8px] font-bold text-slate-700">AIR</span>
                </div>
                <div class="p-1 bg-slate-50 rounded-lg border">
                    <i class="fa-solid fa-bus text-blue-600 text-[10px]"></i>
                    <span class="block text-[8px] font-bold text-slate-700">BUS</span>
                </div>
                <div class="p-1 bg-slate-50 rounded-lg border">
                    <i class="fa-solid fa-hotel text-blue-600 text-[10px]"></i>
                    <span class="block text-[8px] font-bold text-slate-700">HOTEL</span>
                </div>
            </div>
        </div>

        <!-- PAYMENT BUTTON & ORIGINAL LOGOS -->
        <div>
            <button onclick="proceedToRealBooking()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 px-3 rounded-xl shadow-lg flex items-center justify-center gap-2 text-xs tracking-wide transition active:scale-95">
                <i class="fa-solid fa-credit-card"></i> PAY VIA UPI & BOOK
            </button>
            
            <div class="flex items-center justify-center space-x-3 mt-1.5 bg-orange-700/60 py-1.5 px-2 rounded-xl border border-orange-600">
                <div class="flex items-center space-x-1 bg-white px-1.5 py-0.5 rounded shadow-sm">
                    <i class="fa-brands fa-google text-blue-600 text-[10px]"></i>
                    <span class="text-[9px] font-bold text-slate-800">GPay</span>
                </div>
                <div class="flex items-center space-x-1 bg-white px-1.5 py-0.5 rounded shadow-sm">
                    <i class="fa-solid fa-wallet text-sky-500 text-[10px]"></i>
                    <span class="text-[9px] font-bold text-blue-900">Paytm</span>
                </div>
                <div class="flex items-center space-x-1 bg-white px-1.5 py-0.5 rounded shadow-sm">
                    <i class="fa-solid fa-mobile-screen-button text-purple-600 text-[10px]"></i>
                    <span class="text-[9px] font-bold text-purple-700">PhonePe</span>
                </div>
                <div class="flex items-center space-x-1 bg-white px-1.5 py-0.5 rounded shadow-sm">
                    <i class="fa-solid fa-shield-halved text-orange-600 text-[10px]"></i>
                    <span class="text-[9px] font-bold text-slate-800">BHIM</span>
                </div>
            </div>
        </div>

        <!-- Bottom Footer -->
        <div class="flex justify-between items-center text-white text-[10px] font-bold px-1">
            <span>BACK</span>
            <span>USER GUIDE</span>
        </div>

    </div>

    <script>
        const RAPID_CONFIG = {
            API_KEY: "c8ff7efe43mshb615431c4a240fep1cca5ajsnd07a531f7ac1",
            API_HOST: "irctc1.p.rapidapi.com"
        };

        let currentMode = 'pnr';
        let isRecording = false;

        function switchMode(mode) {
            currentMode = mode;
            const tabPnr = document.getElementById('tab-pnr');
            const tabTrain = document.getElementById('tab-train');
            const modeTitle = document.getElementById('mode-title');
            const modeSubtitle = document.getElementById('mode-subtitle');
            document.getElementById('train-list-container').innerHTML = '';

            if(mode === 'pnr') {
                tabPnr.className = "py-1.5 rounded-lg bg-orange-600 text-white transition";
                tabTrain.className = "py-1.5 rounded-lg text-slate-400 hover:text-white transition";
                modeTitle.innerText = "PNR STATUS VOICE CHECKER";
                modeSubtitle.innerText = "🎤 10-digit PNR number bolein";
            } else {
                tabTrain.className = "py-1.5 rounded-lg bg-orange-600 text-white transition";
                tabPnr.className = "py-1.5 rounded-lg text-slate-400 hover:text-white transition";
                modeTitle.innerText = "TRAIN BETWEEN STATIONS";
                modeSubtitle.innerText = "🎤 Station code bolein (jaise: Porbandar to Ahmedabad)";
            }
        }

        function toggleVoiceRecording() {
            const micLabel = document.getElementById('mic-label');
            const micIcon = document.getElementById('mic-icon');
            const transcriptBox = document.getElementById('transcript-box');
            
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Speech recognition requires Google Chrome!");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';

            if (!isRecording) {
                recognition.start();
            } else {
                recognition.stop();
                return;
            }

            recognition.onstart = function() {
                isRecording = true;
                micLabel.innerText = "SUN RAHA HU...";
                micIcon.classList.add('fa-spin');
                transcriptBox.innerText = "Voice sun rahe hain...";
            };

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                transcriptBox.innerText = `Aapne bola: "${speechToText}"`;
                document.getElementById('output-query').innerText = `• Query: ${speechToText}`;
                
                if(currentMode === 'pnr') {
                    fetchPNRData(speechToText);
                } else {
                    fetchTrainData(speechToText);
                }
            };

            recognition.onerror = function() {
                transcriptBox.innerText = "Voice error. Phir se tap karein.";
                resetMicState();
            };

            recognition.onend = function() {
                resetMicState();
            };
        }

        async function fetchPNRData(pnrQuery) {
            const outputStatus = document.getElementById('output-status');
            const trainListContainer = document.getElementById('train-list-container');
            trainListContainer.innerHTML = '';

            try {
                outputStatus.innerText = "• Fetching PNR status...";
                const response = await fetch(`https://${RAPID_CONFIG.API_HOST}/api/v1/getPNRStatus?pnrNumber=${encodeURIComponent(pnrQuery)}`, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': RAPID_CONFIG.API_KEY,
                        'x-rapidapi-host': RAPID_CONFIG.API_HOST
                    }
                });

                const data = await response.json();
                outputStatus.innerText = "• PNR Data Loaded Successfully!";
                
                if(data) {
                    trainListContainer.innerHTML = `<div class="bg-slate-900 p-1.5 rounded border border-slate-700">Response Data Received</div>`;
                }
            } catch (error) {
                outputStatus.innerText = "• Connection error.";
            }
        }

        async function fetchTrainData(trainQuery) {
            const outputStatus = document.getElementById('output-status');
            const trainListContainer = document.getElementById('train-list-container');
            trainListContainer.innerHTML = '';

            try {
                outputStatus.innerText = "• Searching trains...";
                // API Call for Train Between Stations
                const response = await fetch(`https://${RAPID_CONFIG.API_HOST}/api/v1/trainBetweenStations?fromStationCode=PBR&toStationCode=ADI`, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': RAPID_CONFIG.API_KEY,
                        'x-rapidapi-host': RAPID_CONFIG.API_HOST
                    }
                });

                const data = await response.json();
                outputStatus.innerText = "• Trains Found Successfully!";
                
                // Check if API returns data array and display them nicely
                let trains = data.data || data.trains || [];
                if(Array.isArray(trains) && trains.length > 0) {
                    trainListContainer.innerHTML = "";
                    trains.forEach(train => {
                        trainListContainer.innerHTML += `
                            <div class="bg-slate-900 p-1.5 rounded border border-orange-500/30">
                                <div class="font-bold text-yellow-400">${train.train_name || 'Train'} (${train.train_number || ''})</div>
                                <div class="text-[9px] text-slate-300">Dep: ${train.departure_time || 'N/A'} -> Arr: ${train.arrival_time || 'N/A'}</div>
                            </div>
                        `;
                    });
                } else {
                    // Fallback to show general success if structure differs
                    trainListContainer.innerHTML = `<div class="bg-slate-900 p-1.5 rounded border border-slate-700 text-green-400">Data loaded! Check console for details.</div>`;
                }
            } catch (error) {
                outputStatus.innerText = "• Train search error.";
            }
        }

        function resetMicState() {
            isRecording = false;
            document.getElementById('mic-label').innerHTML = `TAP TO SPEAK`;
            document.getElementById('mic-icon').classList.remove('fa-spin');
        }

        function proceedToRealBooking() {
            alert("Redirecting securely to official IRCTC portal for payment.");
            window.open("https://www.irctc.co.in/nget/train-search", "_blank");
        }
    </script>
</body>
</html>
